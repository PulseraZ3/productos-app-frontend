<div class="max-w-6xl mx-auto p-6 grid grid-cols-1 md:grid-cols-2 gap-10">

  <div class="flex flex-col gap-4">
    <div class="bg-white border rounded-xl h-[420px]
                flex items-center justify-center">

      @if (imagenActiva()) {
        <img
          [src]="imagenActiva()"
          class="max-h-full object-contain transition-all duration-300"
        />
      }

    </div>
    <swiper-container
      #swiperThumbs
      init="true"
      slides-per-view="4"
      space-between="12"
      navigation="true"
      class="w-full">

      @for (img of producto()?.imagenes ?? []; track img) {

        <swiper-slide>

          <img
            [src]="img"
            (click)="cambiarImagen(img)"
            class="h-24 w-full object-cover rounded-lg cursor-pointer
                   border-2 transition hover:scale-105"
            [class.border-red-600]="imagenActiva() === img"
            [class.border-gray-200]="imagenActiva() !== img"
          />

        </swiper-slide>

      }

    </swiper-container>

  </div>


  <div class="flex flex-col gap-6">

    <h1 class="text-3xl font-bold">
      {{ producto()?.nombre }}
    </h1>

    <p class="text-gray-500">
      {{ producto()?.descripcion }}
    </p>

    <div class="text-4xl font-bold text-red-600">
      S/ {{ producto()?.precio }}
    </div>

    <button
      class="bg-red-600 text-white py-3 rounded-xl font-bold"
      >

      AGREGAR AL CARRITO

    </button>

  </div>

</div>
